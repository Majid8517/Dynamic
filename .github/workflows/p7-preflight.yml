name: Dynamic BiFPN P7 research preflight

on:
  push:
    branches:
      - research/p7-canonical-opt-in-audit-v1
  pull_request:
    paths:
      - "paper_impl/**"
      - ".github/workflows/p7-preflight.yml"

permissions:
  contents: read

jobs:
  p7-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal CPU test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest PyYAML
      - name: Validate A0-A8 switch matrix
        run: python -m paper_impl.ablation --validate
      - name: Run legacy tests and opt-in P7 tests
        run: |
          python -m pytest -q \
            paper_impl/tests/test_dynamic_bifpn.py \
            paper_impl/tests/test_ablation_matrix.py \
            paper_impl/tests/test_p7_opt_in.py
