name: paper-implementation-ci

on:
  pull_request:
    paths:
      - 'paper_impl/**'
      - 'pyproject.toml'
      - 'README.md'
      - '.github/workflows/paper_impl_ci.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install -r paper_impl/requirements.txt
          pip install -e .
      - name: Compile source
        run: python -m compileall -q paper_impl
      - name: Run smoke test
        run: python -m paper_impl.smoke_test
      - name: Validate ablation matrix
        run: python -m paper_impl.ablation --validate
      - name: Run unit and integration tests
        run: python -m pytest -q paper_impl/tests
