name: paper-implementation-ci

on:
  push:
    branches: [dynamic-bifpn-paper-implementation]
  pull_request:
    paths:
      - 'paper_impl/**'
      - 'pyproject.toml'
      - '.github/workflows/paper_impl_ci.yml'

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision pytest PyYAML
      - name: Compile source
        run: python -m compileall -q paper_impl
      - name: Run core tests
        run: pytest -q paper_impl/tests
