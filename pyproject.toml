[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-bifpn-paper"
version = "0.1.0"
description = "Canonical paper implementation of Stability-Aware Dynamic BiFPN"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=0.9.12",
  "Pillow>=9.5",
  "PyYAML>=6.0",
  "numpy>=1.24",
  "pycocotools>=2.0.7",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
profile = ["fvcore>=0.1.5.post20221221"]

[tool.setuptools.packages.find]
include = ["paper_impl*"]
